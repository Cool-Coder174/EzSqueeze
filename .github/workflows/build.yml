name: Build

on:
  push:
    branches: [ main, newFeature/overhaul ]
  pull_request:
    branches: [ main, newFeature/overhaul ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure
        run: cmake -S . -B build -DEZSQUEEZE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release -j 2

      - name: Test
        run: ctest --test-dir build --output-on-failure
